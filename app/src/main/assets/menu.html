<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>Kavach Main Menu</title>

    <link
            rel="stylesheet"
            href="css/style.css?v=5">

</head>

<body>

<h1 data-i18n="mainMenu">
    Main Menu
</h1>

<div class="main">


    <!-- SMS Protection -->

    <div class="a">

        <button
                class="button sms"
                type="button"
                aria-label="SMS Protection">

            SMS
        </button>

        <h4
                class="h4"
                data-i18n="smsProtection">

            SMS Protection
        </h4>

    </div>


    <!-- WhatsApp Check -->

    <div class="a">

        <button
                class="button whatsapp"
                type="button"
                aria-label="WhatsApp Check">

            WA
        </button>

        <h4
                class="h4"
                data-i18n="whatsappCheck">

            WhatsApp Check
        </h4>

    </div>


    <!-- APK Protection -->

    <div class="a">

        <button
                class="button apk"
                type="button"
                aria-label="APK Protection">

            APK
        </button>

        <h4
                class="h4"
                data-i18n="apkProtection">

            APK Protection
        </h4>

    </div>


    <!-- Trusted Contact -->

    <div class="a">

        <button
                class="button contact"
                type="button"
                aria-label="Trusted Contact">

            TC
        </button>

        <h4
                class="h4"
                data-i18n="trustedContact">

            Trusted Contact
        </h4>

    </div>


    <!-- Report Scam -->

    <div class="a">

        <button
                class="button report"
                type="button"
                aria-label="Report Scam">

            RPT
        </button>

        <h4
                class="h4"
                data-i18n="reportScam">

            Report Scam
        </h4>

    </div>


    <!-- Settings -->

    <div class="a">

        <button
                class="button settings"
                type="button"
                aria-label="Settings">

            SET
        </button>

        <h4
                class="h4-set"
                data-i18n="settings">

            Settings
        </h4>

    </div>


    <!-- Safety reminder -->

    <div class="lasthead">

        <h3
                class="h3"
                data-i18n="safetyReminder">

            Never share your OTP, PIN, password or CVV with anyone.
        </h3>

    </div>

</div>


<!-- Shared translation system -->

<script src="js/common.js"></script>


<!-- Main Menu navigation only -->

<script src="js/menu.js"></script>
<script src="js/setting.js"></script>
<script src="js/sms.js"></script>
<script src="js/wa.js"></script>
<script src="js/tc.js"></script>

</body>

</html>
